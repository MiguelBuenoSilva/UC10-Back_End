info:
  name: Listar categorias por nome que começa com
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8080/v1/api/categorias/?nome=f
  params:
    - name: nome
      value: f
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
