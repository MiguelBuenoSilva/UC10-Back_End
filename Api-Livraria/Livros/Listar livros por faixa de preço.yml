info:
  name: Listar livros por faixa de preço
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8080/v1/api/livros/?valorInicial=10&valorFinal=60
  params:
    - name: valorInicial
      value: "10"
      type: query
    - name: valorFinal
      value: "60"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
