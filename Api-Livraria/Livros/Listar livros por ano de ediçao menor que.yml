info:
  name: Listar livros por ano de ediçao menor que
  type: http
  seq: 6

http:
  method: GET
  url: http://localhost:8080/v1/api/livros/?anoEdicao=2027
  params:
    - name: anoEdicao
      value: "2027"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
