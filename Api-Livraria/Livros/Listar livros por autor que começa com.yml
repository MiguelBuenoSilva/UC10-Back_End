info:
  name: Listar livros por autor que começa com
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8080/v1/api/livros/?autor=Mac
  params:
    - name: autor
      value: Mac
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
