info:
  name: Listar Editoras  por nome que começa com
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8080/v1/api/editoras/?nome=Sho
  params:
    - name: nome
      value: Sho
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
